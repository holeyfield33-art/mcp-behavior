[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-behavior"
version = "0.1.0"
description = "Fixture-based behavioral assessments of running MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcp-behavior = "mcp_behavior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
